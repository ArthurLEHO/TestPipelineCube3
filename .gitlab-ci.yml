# GITLAB CI - Comparaison avec GitHub Actions
# Projet : Site web statique avec pipeline CI/CD

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $CI_PIPELINE_SOURCE == "schedule"

variables:
  NODE_VERSION: "20"
  NPM_CACHE_DIR: "$CI_PROJECT_DIR/.npm-cache"

stages:
  - quality
  - test
  - build
  - deploy-staging
  - deploy-production
  - cleanup

cache:
  key:
    files:
      - package-lock.json
  paths:
    - .npm-cache/
    - node_modules/

.node_template: &node_template
  image: node:20-alpine
  before_script:
    - npm install --cache $NPM_CACHE_DIR

linting:
  stage: quality
  <<: *node_template
  script:
    - echo 'Checking code quality...'
    - npm test

tests:
  stage: test
  <<: *node_template
  script:
    - npm test
  
  artifacts:
    when: always
    expire_in: 1 week
    reports:
      junit: test-results.xml
  
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure

build_website:
  stage: build
  <<: *node_template
  
  needs: 
    - job: linting
    - job: tests
  
  script:
    - npm run build
    - ls -la dist/
  
  artifacts:
    name: "website-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist/
    expire_in: 1 hour

deploy_staging:
  stage: deploy-staging
  image: alpine:latest
  
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: always
    - when: never
  
  environment:
    name: staging
    url: https://staging.mon-app.com
    on_stop: stop_staging
  
  script:
    - echo 'Deploying to staging...'
    - ls -la dist/
    - cat dist/build.json

stop_staging:
  stage: deploy-staging
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "develop"
      when: manual
  environment:
    name: staging
    action: stop
  script:
    - echo 'Stopping staging environment...'

deploy_production:
  stage: deploy-production
  image: alpine:latest
  
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
      when: manual
  
  environment:
    name: production
    url: https://mon-app-prod.com
  
  timeout: 10 minutes
  
  script:
    - echo 'Deploying to production...'
    - ls -la dist/
    - cat dist/build.json
  
  after_script:
    - echo 'Would send notification to Slack/Teams...'

cleanup:
  stage: cleanup
  image: alpine:latest
  
  rules:
    - when: always
  
  script:
    - echo 'Cleaning up temporary resources...'
    - echo "Pipeline finished at $(date)"
